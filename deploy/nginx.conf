map $uri $lifebots_cache_control {
    default "no-cache";
    ~^/releases/ "public, max-age=31536000, immutable";
    ~^/assets/ "public, max-age=86400";
    ~^/(index\.html|config\.js|sw\.js|version\.json|manifest\.webmanifest)$ "no-store";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $lifebots_cache_control;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /assets/ { try_files $uri =404; }
    location ^~ /releases/ { try_files $uri =404; }
    location ~* \.(js|css|json|webmanifest|png|webp|jpg|jpeg|svg|mp3|ogg|wav|ico|map)$ {
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
