<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}body{width:1200px;height:630px;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;position:relative;background:#0a141b}
.back{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.veil{position:absolute;inset:0;background:linear-gradient(100deg,rgba(5,12,17,.92) 0%,rgba(8,18,25,.72) 45%,rgba(10,20,28,.28) 100%)}
.glow{position:absolute;right:-140px;top:-120px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(93,224,194,.28),transparent 65%)}
.mark{position:absolute;right:96px;top:50%;transform:translateY(-50%);width:340px;height:340px;object-fit:contain;filter:drop-shadow(0 24px 60px rgba(0,0,0,.6)) drop-shadow(0 0 42px rgba(93,224,194,.35))}
.copy{position:absolute;left:88px;top:50%;transform:translateY(-50%);max-width:640px;color:#eaf6f1}
.eyebrow{font-size:19px;letter-spacing:6px;text-transform:uppercase;color:#5de0c2;font-weight:700;margin-bottom:18px}
h1{font-size:112px;line-height:.95;letter-spacing:-2px;color:#fff;text-shadow:0 8px 40px rgba(0,0,0,.55);margin-bottom:22px}
p{font-size:29px;line-height:1.35;color:#c8ddd6;margin-bottom:30px}
.tags{display:flex;gap:14px}
.tags span{font-size:18px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#0a141b;background:linear-gradient(90deg,#5de0c2,#8fd8ff);padding:10px 20px;border-radius:999px}
.url{position:absolute;left:88px;bottom:38px;font-size:21px;letter-spacing:3px;color:#5de0c2;font-weight:600}
</style></head><body>
<img class="back" src="../dist/assets/game-backdrop.png">
<div class="veil"></div><div class="glow"></div>
<img class="mark" src="../dist/assets/game-mark.png">
<div class="copy"><div class="eyebrow">Jogo de robôs • estratégia • guildas</div>
<h1>LifeBots</h1>
<p>Construa, evolua e lidere robôs em batalhas, expedições e conquistas de território em tempo real.</p>
<div class="tags"><span>Colecione</span><span>Batalhe</span><span>Conquiste</span></div></div>
<div class="url">LIFEBOTS.COM.BR</div>
</body></html>
